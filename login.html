<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<title>Log in · Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060907'/%3E%3Cpath d='M8 10l6 6-6 6' fill='none' stroke='%233dff8b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 23h8' stroke='%233dff8b' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body data-page="login">
<main class="login">
  <h1 class="prompt type d0">login</h1>
  <form class="tree" id="login-form" novalidate>
    <p class="status" id="status" role="alert" hidden></p>
    <div class="field type d1">
      <label for="password">password:</label>
      <input id="password" type="password" autocomplete="current-password" spellcheck="false" autofocus>
    </div>
    <button class="btn btn-hi type d2" type="submit">enter</button>
  </form>
  <a class="btn back type d3" href="./">back</a>
  <span class="cursor" aria-hidden="true"></span>
</main>
</body>
</html>
